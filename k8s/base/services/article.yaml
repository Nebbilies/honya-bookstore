apiVersion: apps/v1
kind: Deployment
metadata:
  name: article
  labels:
    app.kubernetes.io/name: article
    app.kubernetes.io/part-of: honya
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: article
  template:
    metadata:
      labels:
        app.kubernetes.io/name: article
        app.kubernetes.io/part-of: honya
    spec:
      containers:
        - name: article
          image: ghcr.io/nebbilies/honya-article:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: honya-config
            - secretRef:
                name: honya-secrets
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/article_db
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: article
  labels:
    app.kubernetes.io/name: article
    app.kubernetes.io/part-of: honya
spec:
  selector:
    app.kubernetes.io/name: article
  ports:
    - port: 8083
      targetPort: 8083

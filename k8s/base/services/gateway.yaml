apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: honya
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: honya
    spec:
      containers:
        - name: gateway
          image: ghcr.io/nebbilies/honya-gateway:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: honya-config
            - secretRef:
                name: honya-secrets
          env:
            - name: SERVER_PORT
              value: "8090"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: honya
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - port: 8090
      targetPort: 8090

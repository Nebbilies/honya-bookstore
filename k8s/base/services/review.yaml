apiVersion: apps/v1
kind: Deployment
metadata:
  name: review
  labels:
    app.kubernetes.io/name: review
    app.kubernetes.io/part-of: honya
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: review
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review
        app.kubernetes.io/part-of: honya
    spec:
      containers:
        - name: review
          image: ghcr.io/nebbilies/honya-review:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: honya-config
            - secretRef:
                name: honya-secrets
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/review_db
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: review
  labels:
    app.kubernetes.io/name: review
    app.kubernetes.io/part-of: honya
spec:
  selector:
    app.kubernetes.io/name: review
  ports:
    - port: 8084
      targetPort: 8084

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: honya
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: honya
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/nebbilies/honya-dashboard:latest
          ports:
            - containerPort: 8089
          envFrom:
            - configMapRef:
                name: honya-config
            - secretRef:
                name: honya-secrets
          env:
            - name: SERVER_PORT
              value: "8089"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8089
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8089
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: honya
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - port: 8089
      targetPort: 8089

spring:
  application:
    name: catalog

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${SPRING_DATASOURCE_USERNAME:catalog}
    password: ${SPRING_DATASOURCE_PASSWORD:catalog}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog_db}
    user: ${SPRING_DATASOURCE_USERNAME:catalog}
    password: ${SPRING_DATASOURCE_PASSWORD:catalog}
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/honya}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt:
      audience: ${JWT_AUDIENCE:honya-api}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/honya/protocol/openid-connect/certs}

media:
  base-url: ${MEDIA_BASE_URL:http://localhost:8082}

server:
  port: ${SERVER_PORT:8086}

otel:
  enabled: ${OTEL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLING:1.0}

bookstore:
  catalog-outbox:
    relay-fixed-delay-ms: ${CATALOG_OUTBOX_RELAY_DELAY_MS:1000}
  messaging:
    dead-letter:
      exchange: ${MESSAGING_DEAD_LETTER_EXCHANGE:catalog.dlx}
      queue: ${MESSAGING_DEAD_LETTER_QUEUE:catalog.dlq}

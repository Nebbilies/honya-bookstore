spring:
  application:
    name: checkout

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/checkout_db}
    username: ${SPRING_DATASOURCE_USERNAME:checkout}
    password: ${SPRING_DATASOURCE_PASSWORD:checkout}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/checkout_db}
    user: ${SPRING_DATASOURCE_USERNAME:checkout}
    password: ${SPRING_DATASOURCE_PASSWORD:checkout}
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/honya}

app:
  security:
    jwt:
      audience: ${JWT_AUDIENCE:honya-api}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/honya/protocol/openid-connect/certs}

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8086}

cart:
  base-url: ${CART_BASE_URL:http://localhost:8087}

order:
  base-url: ${ORDER_BASE_URL:http://localhost:8088}

bookstore:
  saga:
    payment-timeout-minutes: ${SAGA_PAYMENT_TIMEOUT_MINUTES:15}
    sweep-fixed-delay-ms: ${SAGA_SWEEP_DELAY_MS:5000}
  outbox:
    relay-fixed-delay-ms: ${CHECKOUT_OUTBOX_RELAY_DELAY_MS:1000}

server:
  port: ${SERVER_PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info

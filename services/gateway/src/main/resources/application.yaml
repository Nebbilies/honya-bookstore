spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: media-service
              uri: ${MEDIA_URI:http://localhost:8082}
              order: -1
              predicates:
                - Path=/api/media/**
            - id: article-service
              uri: ${ARTICLE_URI:http://localhost:8083}
              order: -1
              predicates:
                - Path=/api/articles/**
            - id: review-service
              uri: ${REVIEW_URI:http://localhost:8084}
              order: -1
              predicates:
                - Path=/api/reviews/**
            - id: user-service
              uri: ${USER_URI:http://localhost:8085}
              order: -1
              predicates:
                - Path=/api/users/**
            - id: catalog-service
              uri: ${CATALOG_URI:http://localhost:8086}
              order: -1
              predicates:
                - Path=/api/books/**,/api/categories/**
            - id: cart-service
              uri: ${CART_URI:http://localhost:8087}
              order: -1
              predicates:
                - Path=/api/cart/**
            - id: order-service
              uri: ${ORDER_URI:http://localhost:8088}
              order: -1
              predicates:
                - Path=/api/orders/**
            - id: dashboard-service
              uri: ${DASHBOARD_URI:http://localhost:8089}
              order: -1
              predicates:
                - Path=/api/dashboard/**
            - id: checkout-service
              uri: ${CHECKOUT_URI:http://localhost:8091}
              order: -1
              predicates:
                - Path=/api/checkout/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_ORIGIN:http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

server:
  port: ${SERVER_PORT:8090}

otel:
  enabled: ${OTEL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLING:1.0}

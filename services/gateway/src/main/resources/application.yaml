spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: media-service
              uri: ${MEDIA_URI:http://localhost:8082}
              order: -1
              predicates:
                - Path=/api/media/**
            - id: article-service
              uri: ${ARTICLE_URI:http://localhost:8083}
              order: -1
              predicates:
                - Path=/api/articles/**
            - id: review-service
              uri: ${REVIEW_URI:http://localhost:8084}
              order: -1
              predicates:
                - Path=/api/reviews/**
            - id: monolith-api
              uri: ${MONOLITH_URI:http://localhost:8081}
              predicates:
                - Path=/api/**
            - id: monolith-swagger
              uri: ${MONOLITH_URI:http://localhost:8081}
              predicates:
                - Path=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_ORIGIN:http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

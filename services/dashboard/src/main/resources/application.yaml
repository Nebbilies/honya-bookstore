spring:
  application:
    name: dashboard

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/honya}

app:
  security:
    jwt:
      audience: ${JWT_AUDIENCE:honya-api}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/honya/protocol/openid-connect/certs}

order:
  base-url: ${ORDER_BASE_URL:http://localhost:8088}

user:
  base-url: ${USER_BASE_URL:http://localhost:8085}

server:
  port: ${SERVER_PORT:8089}

otel:
  enabled: ${OTEL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  tracing:
    export:
      enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLING:1.0}

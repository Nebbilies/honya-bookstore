x-otel-env: &otel-env
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  OTEL_SAMPLING: "1.0"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: honya_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./platform/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:latest
    container_name: honya_prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./platform/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  tempo:
    image: grafana/tempo:latest
    container_name: honya_tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./platform/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:latest
    container_name: honya_loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./platform/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    container_name: honya_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./platform/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  gateway:
    environment: *otel-env

  media:
    environment: *otel-env

  article:
    environment: *otel-env

  review:
    environment: *otel-env

  user:
    environment: *otel-env

  catalog:
    environment: *otel-env

  cart:
    environment: *otel-env

  order:
    environment: *otel-env

  dashboard:
    environment: *otel-env

  checkout:
    environment: *otel-env

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:

services:
  postgres:
    volumes:
      - ./platform/postgres-init:/docker-entrypoint-initdb.d:ro

  media:
    build:
      context: ./services/media
    image: honya-bookstore-media:latest
    container_name: honya_media
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/media_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
      SPRING_MINIO_INTERNAL_URL: http://minio:9000
      SPRING_MINIO_PUBLIC_URL: http://localhost:9000
      SPRING_MINIO_ACCESS_KEY: minioadmin
      SPRING_MINIO_SECRET_KEY: minioadmin
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started

  article:
    build:
      context: ./services/article
    image: honya-bookstore-article:latest
    container_name: honya_article
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/article_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  backend:
    environment:
      MEDIA_BASE_URL: http://media:8082
    depends_on:
      media:
        condition: service_started

  gateway:
    build:
      context: ./services/gateway
    image: honya-bookstore-gateway:latest
    container_name: honya_gateway
    environment:
      MONOLITH_URI: http://backend:8081
      MEDIA_URI: http://media:8082
      ARTICLE_URI: http://article:8083
      FRONTEND_ORIGIN: http://localhost:3000
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      backend:
        condition: service_started
      media:
        condition: service_started
      article:
        condition: service_started

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8090/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090/api
      API_INTERNAL_URL: http://gateway:8090/api
    depends_on:
      gateway:
        condition: service_started

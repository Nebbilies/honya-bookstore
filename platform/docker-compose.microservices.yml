services:
  postgres:
    volumes:
      - ./platform/postgres-init:/docker-entrypoint-initdb.d:ro

  media:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/media
    image: honya-bookstore-media:latest
    container_name: honya_media
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/media_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
      SPRING_MINIO_INTERNAL_URL: http://minio:9000
      SPRING_MINIO_PUBLIC_URL: http://localhost:9000
      SPRING_MINIO_ACCESS_KEY: minioadmin
      SPRING_MINIO_SECRET_KEY: minioadmin
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started

  article:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/article
    image: honya-bookstore-article:latest
    container_name: honya_article
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/article_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  review:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/review
    image: honya-bookstore-review:latest
    container_name: honya_review
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/review_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  user:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/user
    image: honya-bookstore-user:latest
    container_name: honya_user
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  catalog:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/catalog
    image: honya-bookstore-catalog:latest
    container_name: honya_catalog
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
      MEDIA_BASE_URL: http://media:8082
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      media:
        condition: service_started

  cart:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/cart
    image: honya-bookstore-cart:latest
    container_name: honya_cart
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cart_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
      CATALOG_BASE_URL: http://catalog:8086
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      catalog:
        condition: service_started

  order:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/order
    image: honya-bookstore-order:latest
    container_name: honya_order
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
      CATALOG_BASE_URL: http://catalog:8086
      CART_BASE_URL: http://cart:8087
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_PAYMENT_RETURN_URL: http://localhost:8090/api/orders/payment/vnpay/return
      VNPAY_IPN_URL: http://localhost:8090/api/orders/payment/vnpay/ipn
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      catalog:
        condition: service_started
      cart:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/dashboard
    image: honya-bookstore-dashboard:latest
    container_name: honya_dashboard
    environment:
      SERVER_PORT: 8089
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
      ORDER_BASE_URL: http://order:8088
      USER_BASE_URL: http://user:8085
    ports:
      - "8089:8089"
    depends_on:
      keycloak:
        condition: service_started
      order:
        condition: service_started
      user:
        condition: service_started

  checkout:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/checkout
    image: honya-bookstore-checkout:latest
    container_name: honya_checkout
    environment:
      SERVER_PORT: 8091
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/honya
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/honya/protocol/openid-connect/certs
      CATALOG_BASE_URL: http://catalog:8086
      CART_BASE_URL: http://cart:8087
      ORDER_BASE_URL: http://order:8088
    ports:
      - "8091:8091"
    depends_on:
      keycloak:
        condition: service_started
      catalog:
        condition: service_started
      cart:
        condition: service_started
      order:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.services
      args:
        MODULE: services/gateway
    image: honya-bookstore-gateway:latest
    container_name: honya_gateway
    environment:
      MONOLITH_URI: http://backend:8081
      MEDIA_URI: http://media:8082
      ARTICLE_URI: http://article:8083
      REVIEW_URI: http://review:8084
      USER_URI: http://user:8085
      CATALOG_URI: http://catalog:8086
      CART_URI: http://cart:8087
      ORDER_URI: http://order:8088
      DASHBOARD_URI: http://dashboard:8089
      CHECKOUT_URI: http://checkout:8091
      FRONTEND_ORIGIN: http://localhost:3000
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      backend:
        condition: service_started
      media:
        condition: service_started
      article:
        condition: service_started
      review:
        condition: service_started
      user:
        condition: service_started
      catalog:
        condition: service_started
      cart:
        condition: service_started
      order:
        condition: service_started
      dashboard:
        condition: service_started
      checkout:
        condition: service_started

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8090/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090/api
      API_INTERNAL_URL: http://gateway:8090/api
    depends_on:
      gateway:
        condition: service_started
